[build]
  command = "npm test && npm run build"

# Runtime secrets live in the Netlify UI, not here. DATABASE_URL must be the
# Supabase Supavisor transaction pooler URL (port 6543): functions are
# short-lived, and src/db/client.ts disables prepared statements for it.
[build.environment]
  NODE_VERSION = "24.14.0"
  NPM_FLAGS = "--ignore-scripts"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Netlify applies these only to files served from its CDN (static assets),
# not to server-rendered pages: next.config.js sets the same headers on those.
# Keep the two lists in sync.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
