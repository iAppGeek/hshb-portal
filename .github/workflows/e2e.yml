name: E2E Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event.pull_request.draft == false

    env:
      E2E_TEST: 'true'
      E2E_TEST_SECRET: ${{ secrets.E2E_TEST_SECRET }}
      AUTH_SECRET: e2e-ci-secret
      AUTH_URL: http://localhost:3000
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      # Supabase CLI's public local-dev demo key — fixed, identical on every
      # machine, and only valid against the ephemeral instance this job starts.
      SUPABASE_SERVICE_ROLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImV4cCI6MTk4MzgxMjk5Nn0.EGIM96RAZx35lJzdJsyH-qQwv8Hdp7fsn3W0YpN81IU
      AZURE_AD_CLIENT_ID: ci-placeholder
      AZURE_AD_CLIENT_SECRET: ci-placeholder
      AZURE_AD_TENANT_ID: ci-placeholder
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
      TURNSTILE_SECRET_KEY: 1x0000000000000000000000000000000AA
      VAPID_SUBJECT: mailto:e2e@test.hshb.local

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate a throwaway VAPID keypair
        run: |
          KEYS=$(npx web-push generate-vapid-keys --json)
          echo "NEXT_PUBLIC_VAPID_PUBLIC_KEY=$(echo "$KEYS" | jq -r .publicKey)" >> "$GITHUB_ENV"
          echo "VAPID_PRIVATE_KEY=$(echo "$KEYS" | jq -r .privateKey)" >> "$GITHUB_ENV"

      - name: Start local Supabase
        run: npx supabase start

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: e2e/.report/
          retention-days: 7
